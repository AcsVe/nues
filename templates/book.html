<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ lang == 'ar' and 'rtl' or 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ lang == 'ar' and 'نموذج الحجز' or 'Booking Form' }}</title>
    <script>
      ;(function () {
        var t = new URLSearchParams(location.search).get('theme');
        if (t) document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="book-page">
    <div class="top-bar">
        <div class="logo-area">
            <img src="{{ logo }}" alt="Logo">
            <div>
                <h1 id="hdrTitle">{{ org_ar }}</h1>
                <p id="hdrSub">نموذج طلب حجز قاعة أو مرفق</p>
            </div>
        </div>
        <div class="top-actions">
            <div class="clock-display"><i class="fas fa-clock"></i> <span id="clockEl"></span></div>
            <button class="btn-top" onclick="toggleLang()" id="btnLang"><i class="fas fa-globe"></i> <span id="langTxt">{{ lang == 'ar' and 'EN' or 'عربي' }}</span></button>
        </div>
    </div>

    <div class="wrap narrow">
        <a class="back-link" id="backLink" href="/?lang={{ lang }}"><i class="fas fa-arrow-{{ lang == 'ar' and 'right' or 'left' }}"></i> <span id="tBack">العودة للروزنامة</span></a>

        <div id="formWrap">
            <!-- ── Lookup / Amend / Cancel card ── -->
            <div class="card">
                <h3><i class="fas fa-search"></i> <span id="secLookup">تعديل / إلغاء حجز موجود</span></h3>
                <div class="row2">
                    <div class="fg">
                        <label><span id="lLookupId">رقم الطلب</span> <span class="req">*</span></label>
                        <input type="text" id="lookupId" placeholder="PUB-..." dir="ltr">
                    </div>
                    <div class="fg">
                        <label><span id="lLookupEmail">البريد الإلكتروني</span> <span class="req">*</span></label>
                        <input type="email" id="lookupEmail" placeholder="example@email.com" dir="ltr">
                    </div>
                </div>
                <button class="sub-btn secondary" id="btnLookup" onclick="lookupBooking()">
                    <i class="fas fa-search"></i> <span id="tLookup">بحث عن حجزي</span>
                </button>
                <div id="lookupResult" class="lookup-result" style="display:none"></div>
            </div>

            <!-- ── Personal Info card ── -->
            <div class="card">
                <h3><i class="fas fa-user"></i> <span id="sec1">البيانات الشخصية</span></h3>
                <div class="row2">
                    <div class="fg">
                        <label><span id="lName">الاسم الكامل</span> <span class="req">*</span></label>
                        <input type="text" id="fName" placeholder="أدخل اسمك الكامل">
                    </div>
                    <div class="fg">
                        <label><span id="lEmail">البريد الإلكتروني</span> <span class="req">*</span></label>
                        <input type="email" id="fEmail" placeholder="example@email.com" dir="ltr">
                    </div>
                </div>
                <div class="row2">
                    <div class="fg">
                        <label id="lPhone">رقم الجوال</label>
                        <input type="tel" id="fPhone" placeholder="05XXXXXXXX" dir="ltr">
                    </div>
                    <div class="fg">
                        <label id="lBehalf">الحجز نيابة عن</label>
                        <input type="text" id="fBehalf" placeholder="اسم الجهة أو الشخص (اختياري)">
                    </div>
                </div>
            </div>

            <!-- ── Booking Details card ── -->
            <div class="card">
                <h3><i class="fas fa-calendar-check"></i> <span id="sec2">تفاصيل الحجز</span></h3>
                <div class="fg">
                    <label><span id="lTitle">عنوان المناسبة</span> <span class="req">*</span></label>
                    <input type="text" id="fTitle" placeholder="مثال: ورشة عمل">
                </div>
                <div class="fg">
                    <label><span id="lHall">اختيار القاعة</span> <span class="req">*</span></label>
                    <select id="fHall" onchange="showHallInfo()">
                        <option value="">— اختر القاعة —</option>
                    </select>
                </div>
                <div class="hall-info-box" id="hallInfo"></div>

                <div class="row2">
                    <div class="fg">
                        <label><span id="lDate">تاريخ البداية</span> <span class="req">*</span></label>
                        <input type="date" id="fDate" value="{{ pre_date }}">
                    </div>
                    <div class="fg">
                        <label id="lEndDate">تاريخ الانتهاء</label>
                        <input type="date" id="fEndDate" value="{{ pre_date }}">
                    </div>
                </div>

                <div class="fd-wrap">
                    <input type="checkbox" id="fFullDay" onchange="toggleFullDay()">
                    <label for="fFullDay"><i class="fas fa-sun"></i> <span id="lFull">حجز يوم كامل</span></label>
                </div>

                <div class="time-row" id="timeRow">
                    <div class="fg">
                        <label><span id="lFrom">من الساعة</span> <span class="req">*</span></label>
                        <input type="time" id="fStart">
                    </div>
                    <div class="fg">
                        <label><span id="lTo">إلى الساعة</span> <span class="req">*</span></label>
                        <input type="time" id="fEnd">
                    </div>
                </div>

                <div class="fg">
                    <label id="lCc">نسخة إلى (CC) — عناوين بريد إلكتروني مفصولة بفواصل</label>
                    <input type="text" id="fCc" placeholder="person1@x.com, person2@y.com" dir="ltr">
                </div>

                <div class="fg">
                    <label id="lNotes">ملاحظات إضافية</label>
                    <textarea id="fNotes" placeholder="أي تفاصيل أو متطلبات خاصة..."></textarea>
                </div>
            </div>

            <!-- ── Attachments card ── -->
            <div class="card" id="attCard">
                <h3><i class="fas fa-paperclip"></i> <span id="sec3">المرفقات</span></h3>
                <label class="file-area">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p id="fileHint">اضغط لرفع ملفات</p>
                    <p class="file-sub" id="fileSub">الحد الأقصى 10 ميجا للملف</p>
                    <input type="file" id="fileIn" multiple>
                </label>
                <div class="att-list" id="attList"></div>
            </div>

            <!-- ── Terms agreement ── -->
            <div class="terms-wrap" id="termsWrap">
                <input type="checkbox" id="fTerms">
                <label for="fTerms"><i class="fas fa-circle-check"></i> <span id="lTerms">أوافق على شروط وأحكام استخدام القاعات والمرافق</span> <span class="req">*</span></label>
            </div>

            <div id="actionButtons">
                <button class="sub-btn" id="subBtn" onclick="submitForm()">
                    <i class="fas fa-paper-plane"></i> <span id="tSub">إرسال الطلب</span>
                </button>
            </div>
            <div id="status"></div>
        </div>

        <div class="success-box" id="successBox" style="display:none">
            <i class="fas fa-check-circle"></i>
            <h2 id="sucTitle">تم إرسال طلبك بنجاح!</h2>
            <div class="req-id" id="reqIdDisp"></div>
            <p id="sucMsg">سيتم مراجعة طلبك وإبلاغك بالنتيجة عبر البريد الإلكتروني</p>
            <br>
            <a class="back-link" href="/?lang={{ lang }}" style="font-size:15px"><i class="fas fa-calendar"></i> <span id="sucBack">عرض الروزنامة</span></a>
        </div>
    </div>

    <script>
        window.__LANG__ = "{{ lang }}";
        window.__ORG_AR__ = "{{ org_ar }}";
        window.__ORG_EN__ = "{{ org_en }}";
    </script>
    <script src="/static/js/book.js"></script>
    <script>(function(){var t=new URLSearchParams(location.search).get('theme');if(!t)return;document.querySelectorAll('a[href]').forEach(function(a){try{var u=new URL(a.href,location.href);if(u.origin!==location.origin)return;if(!u.searchParams.get('theme'))u.searchParams.set('theme',t);a.href=u.pathname+'?'+u.searchParams.toString();}catch(e){}});})();</script>
</body>
</html>
